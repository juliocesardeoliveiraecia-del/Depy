<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#04020f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Depy — Uma presença digital. JCO Company.">
<title>Depy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#04020f;--v1:#6d28d9;--v2:#9333ea;--v3:#c4b5fd;
  --v4:#e879f9;--cyan:#22d3ee;--text:#f0ebff;
  --dim:rgba(196,181,253,0.35);--dim2:rgba(196,181,253,0.15)
}
html,body{background:var(--bg);color:var(--text);font-family:"Inter",sans-serif;height:100%;overflow:hidden;overscroll-behavior:none}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* SCREENS */
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s ease}
.screen.active{opacity:1;pointer-events:all}

/* SPLASH */
#splash{background:rgba(4,2,15,.9)}
.splash-logo{width:130px;height:130px;border-radius:50%;overflow:hidden;box-shadow:0 0 80px rgba(167,139,250,.6),0 0 160px rgba(109,40,217,.3);animation:breathe 3s ease-in-out infinite}
.splash-logo img{width:100%;height:100%;object-fit:cover}
.splash-name{font-family:"Syne",sans-serif;font-size:44px;font-weight:800;background:linear-gradient(135deg,#c4b5fd,#e879f9,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1px;margin-top:22px}
.splash-tag{font-size:11px;letter-spacing:4px;color:rgba(196,181,253,.3);text-transform:uppercase;margin-top:8px}

/* LANGUAGE */
#language{padding:40px 24px;overflow-y:auto;justify-content:center}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:380px;margin:28px 0}
.lang-card{display:flex;align-items:center;gap:12px;padding:16px;background:rgba(255,255,255,.03);border:1.5px solid rgba(167,139,250,.12);border-radius:18px;cursor:pointer;transition:all .2s;color:rgba(196,181,253,.6)}
.lang-card.sel{background:rgba(109,40,217,.22);border-color:rgba(167,139,250,.55);color:#f0ebff}
.lang-card .lf{font-size:24px}.lang-card .ln{font-size:14px;font-weight:500}

/* AUTH */
#auth{padding:32px 24px}
.auth-wrap{width:100%;max-width:380px}
.flbl{font-size:11px;letter-spacing:2px;color:rgba(196,181,253,.45);text-transform:uppercase;margin-bottom:8px;display:block}
.finp{width:100%;padding:14px 16px;background:rgba(255,255,255,.04);border:1.5px solid rgba(167,139,250,.18);border-radius:14px;color:var(--text);font-size:15px;font-family:"Inter",sans-serif;outline:none;transition:border-color .2s}
.finp:focus{border-color:rgba(167,139,250,.5);background:rgba(255,255,255,.06)}
.g-row{display:flex;gap:10px;margin-bottom:20px}
.g-btn{flex:1;padding:11px 8px;border-radius:12px;border:1.5px solid rgba(167,139,250,.15);background:transparent;color:rgba(196,181,253,.4);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:"Inter",sans-serif}
.g-btn.on{border-color:var(--v3);background:rgba(167,139,250,.15);color:var(--v3)}

/* BUTTONS */
.btn-p{width:100%;padding:16px;border-radius:50px;border:none;background:linear-gradient(135deg,#6d28d9,#e879f9);color:#fff;font-family:"Syne",sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s,transform .15s;letter-spacing:.3px}
.btn-p:active{transform:scale(.97)}
.btn-g{background:none;border:none;color:var(--dim);font-size:13px;cursor:pointer;padding:10px;font-family:"Inter",sans-serif;transition:color .2s;width:100%}
.btn-g:hover{color:var(--v3)}

/* MYSTERY */
#mystery{background:rgba(4,2,15,.94)}
.mys-txt{font-family:"Syne",sans-serif;font-size:clamp(20px,5vw,30px);font-weight:700;color:rgba(196,181,253,.85);text-align:center;line-height:1.5;max-width:360px;padding:0 32px;opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s ease}
.mys-txt.show{opacity:1;transform:translateY(0)}
.mys-dots{position:absolute;bottom:56px;display:flex;gap:8px}
.mys-dot{height:6px;border-radius:3px;background:rgba(196,181,253,.25);transition:all .4s;width:6px}
.mys-dot.on{background:rgba(196,181,253,.8);width:20px}

/* BIRTH */
#birth{background:rgba(4,2,15,.72)}
#aura-birth{position:absolute;inset:0;width:100%;height:100%}
.birth-msgs{position:absolute;bottom:15vh;width:100%;display:flex;flex-direction:column;align-items:center;gap:20px;z-index:2}
.birth-msg{font-family:"Syne",sans-serif;text-align:center;opacity:0;transform:translateY(12px);transition:opacity 1s ease,transform 1s ease}
.birth-msg.show{opacity:1;transform:translateY(0)}

/* CHAT */
#chat{justify-content:flex-start;padding:0}
#aura-main{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.topbar{position:fixed;top:0;left:0;right:0;z-index:30;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(4,2,15,.96) 0%,rgba(4,2,15,0) 100%)}
.tb-l{display:flex;align-items:center;gap:12px}
.tb-av{width:38px;height:38px;border-radius:50%;overflow:hidden;border:1.5px solid rgba(167,139,250,.35);background:rgba(109,40,217,.25);display:flex;align-items:center;justify-content:center;font-family:"Syne",sans-serif;font-size:16px;font-weight:700;color:var(--v3);flex-shrink:0}
.tb-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.tb-name{font-family:"Syne",sans-serif;font-size:14px;font-weight:700;color:#f0ebff}
.tb-sub{font-size:11px;color:rgba(196,181,253,.4);margin-top:1px}
.tb-btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(167,139,250,.2);background:rgba(255,255,255,.03);color:rgba(196,181,253,.5);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.chat-sc{position:absolute;inset:0;overflow-y:auto;padding:72px 16px 110px;display:flex;flex-direction:column;z-index:2;scrollbar-width:thin;scrollbar-color:rgba(109,40,217,.3) transparent}
.msg-w{display:flex;margin-bottom:10px;animation:msgIn .35s ease forwards}
.msg-w.u{justify-content:flex-end}.msg-w.d{justify-content:flex-start}
.msg-b{max-width:78%;padding:11px 15px;font-size:15px;line-height:1.6;font-family:"Inter",sans-serif}
.msg-w.u .msg-b{background:linear-gradient(135deg,rgba(109,40,217,.65),rgba(232,121,249,.45));border-radius:18px 18px 4px 18px;color:#f0ebff}
.msg-w.d .msg-b{background:rgba(255,255,255,.045);border:1px solid rgba(167,139,250,.1);border-radius:18px 18px 18px 4px;color:rgba(196,181,253,.92);letter-spacing:.1px}
.typing-b{display:flex;gap:5px;align-items:center;padding:13px 16px;background:rgba(255,255,255,.04);border:1px solid rgba(167,139,250,.1);border-radius:18px 18px 18px 4px}
.t-dot{width:6px;height:6px;border-radius:50%;background:var(--v3);animation:blink 1.4s ease-in-out infinite}
.t-dot:nth-child(2){animation-delay:.2s}.t-dot:nth-child(3){animation-delay:.4s}
.inp-bar{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:10px 16px 28px;background:linear-gradient(0deg,rgba(4,2,15,.98) 60%,rgba(4,2,15,0) 100%)}
.inp-inner{display:flex;gap:10px;align-items:flex-end;background:rgba(255,255,255,.04);border:1px solid rgba(167,139,250,.2);border-radius:24px;padding:10px 14px;transition:border-color .2s}
.inp-inner:focus-within{border-color:rgba(167,139,250,.45)}
#chatInput{flex:1;background:none;border:none;outline:none;resize:none;color:var(--text);font-size:15px;line-height:1.5;font-family:"Inter",sans-serif;max-height:120px;padding:2px 0}
.send-btn{width:38px;height:38px;border-radius:50%;border:none;flex-shrink:0;background:rgba(167,139,250,.1);color:rgba(167,139,250,.25);font-size:18px;cursor:not-allowed;display:flex;align-items:center;justify-content:center;transition:all .2s}
.send-btn.on{background:linear-gradient(135deg,#6d28d9,#e879f9);color:#fff;cursor:pointer}
.send-btn:active{transform:scale(.9)}
.phase-bar{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:25;display:flex;gap:6px;pointer-events:none;opacity:0;transition:opacity .5s}
.phase-bar.show{opacity:1}
.ph-dot{width:5px;height:5px;border-radius:50%;background:rgba(196,181,253,.2);transition:all .4s}
.ph-dot.on{background:var(--v3);box-shadow:0 0 8px rgba(196,181,253,.6)}

/* SETTINGS */
#settings{justify-content:flex-start;padding:0;overflow-y:auto}
.sett-sc{width:100%;max-width:520px;padding:70px 20px 80px}
.sett-hd{position:fixed;top:0;left:0;right:0;z-index:30;padding:16px 20px;display:flex;align-items:center;gap:16px;background:linear-gradient(180deg,rgba(4,2,15,.97) 0%,rgba(4,2,15,0) 100%)}
.sett-slbl{font-size:10px;letter-spacing:3px;color:rgba(196,181,253,.3);text-transform:uppercase;margin:24px 0 10px}
.sett-blk{background:rgba(255,255,255,.03);border:1px solid rgba(167,139,250,.1);border-radius:18px;overflow:hidden;margin-bottom:4px}
.sett-row{display:flex;align-items:center;gap:14px;padding:15px 16px;border-bottom:1px solid rgba(167,139,250,.06);cursor:pointer;transition:background .15s}
.sett-row:last-child{border-bottom:none}
.sett-ic{font-size:18px;width:26px;text-align:center;flex-shrink:0}
.sett-info{flex:1;min-width:0}
.sett-lbl{font-size:14px;font-weight:500;color:#f0ebff}
.sett-sub{font-size:12px;color:rgba(196,181,253,.35);margin-top:2px}
.sett-r{font-size:13px;color:rgba(196,181,253,.35);flex-shrink:0}
.danger{color:#fca5a5}

/* MODAL */
.modal-ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.88);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-ov.open{opacity:1;pointer-events:all}
.modal-bx{width:100%;max-width:370px;background:#080420;border:1px solid rgba(167,139,250,.2);border-radius:26px;padding:30px 24px;text-align:center;transform:scale(.9);transition:transform .3s}
.modal-ov.open .modal-bx{transform:scale(1)}

/* ERR */
.err{font-size:13px;color:#fca5a5;text-align:center;padding:4px 0;min-height:20px}

/* ANIMATIONS */
@keyframes breathe{0%,100%{box-shadow:0 0 80px rgba(167,139,250,.6),0 0 160px rgba(109,40,217,.3)}50%{box-shadow:0 0 120px rgba(232,121,249,.8),0 0 200px rgba(109,40,217,.5)}}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(109,40,217,.35);border-radius:4px}
</style>
</head>
